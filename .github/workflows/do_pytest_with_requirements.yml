name: Do pytest with requirements
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest 05_01_pytest